<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suficiente en Cristo · Plan personal de libertad</title>
<style>
:root{--n:#14284B;--t:#B8532F;--t2:#D9744F;--soft:#F8E8E0;--tint:#EEF2F8;--ink:#1B2433;--line:#D9DFEA;--sans:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 Georgia,"Times New Roman",serif;color:var(--ink);background:#fff;padding-bottom:84px}
header{background:var(--n);color:#fff;padding:22px 18px 18px;border-bottom:6px solid var(--t);text-align:center}
header h1{margin:0;font:800 22px/1.2 var(--sans)}
header p{margin:6px 0 0;font:14px var(--sans);color:#cdd6e8}
main{max-width:720px;margin:0 auto;padding:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--n);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-top:4px solid transparent;color:#b9c5dc;padding:12px 2px 10px;font:700 12px var(--sans);cursor:pointer}
nav button.on{color:#fff;border-top-color:var(--t2)}
h2{font:800 21px/1.25 var(--sans);color:var(--n);margin:0 0 6px}
.m{color:#566176;font:14px/1.5 var(--sans);margin:0 0 14px}
.card{border:1px solid var(--line);border-top:5px solid var(--n);border-radius:12px;padding:16px;margin:0 0 16px}
.card.t{border-top-color:var(--t)}
label{display:block;font:700 14px var(--sans);color:var(--n);margin:12px 0 5px}
input,select,textarea{width:100%;font:16px var(--sans);padding:10px 12px;border:1px solid #b8c2d6;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--n);background:#fff;color:var(--n);border-radius:20px;padding:7px 13px;font:700 14px var(--sans);cursor:pointer}
.chip.on{background:var(--n);color:#fff}
.btn{background:var(--t);color:#fff;border:0;border-radius:10px;padding:13px 18px;font:800 16px var(--sans);cursor:pointer;margin-top:14px;width:100%}
.btn.s{background:var(--n)}
.btn.g{background:#fff;color:var(--t);border:2px solid var(--t)}
.lie{color:var(--t);font:700 15px var(--sans);text-decoration:line-through;text-decoration-thickness:2px}
.truth{color:var(--n);font:700 17px/1.4 var(--sans);margin:4px 0}
.ref{display:inline-block;background:var(--t);color:#fff;font:700 12px var(--sans);padding:4px 9px;border-radius:14px;margin-top:4px}
.big{background:var(--n);color:#fff;border-radius:12px;padding:18px;border-bottom:5px solid var(--t);margin:0 0 16px}
.big .truth{color:#fff;font-size:20px}
.bar{display:flex;align-items:center;gap:8px;font:13px var(--sans);margin:4px 0}
.bar i{display:block;height:12px;background:var(--t);border-radius:6px}
details{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
summary{cursor:pointer;background:var(--tint);padding:13px 16px;font:800 16px var(--sans);color:var(--n)}
details>div{padding:4px 16px 14px}
.q{margin:14px 0 0}
.q p{margin:0 0 6px}
.ck{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;width:100%;background:#fff;text-align:left;font:16px/1.4 var(--sans);color:var(--ink)}
.ck b{flex:none;width:24px;height:24px;border:3px solid var(--t);border-radius:6px;display:block}
.ck.on{background:var(--soft);border-color:var(--t)}
.ck.on b{background:var(--t)}
.x{float:right;background:none;border:0;color:#8a93a5;font-size:18px;cursor:pointer}
#cr{position:fixed;inset:0;background:var(--n);color:#fff;overflow:auto;padding:24px 20px;z-index:9}
#cr h2{color:#fff;font-size:28px}
#cr .f{background:#1F3A68;border-left:6px solid var(--t2);border-radius:8px;padding:12px 14px;margin:10px 0;font:18px/1.4 var(--sans)}
#cr .f small{display:block;color:#f0b9a5;font-weight:700;font-size:13px}
.note{background:var(--soft);border-left:6px solid var(--t);padding:12px 14px;border-radius:0 8px 8px 0;font:14px/1.5 var(--sans);margin:16px 0}
</style>
</head>
<body>
<header><h1>Suficiente en Cristo</h1><p>Plan personal de libertad</p></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K="plan-libertad-v1";
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({e:[],m:[],r:{},p:{},c:[]},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="hoy",crisis=false,D={emo:"",trig:"",did:"",truth:"",nm:"",nv:"",nr:""};

const EMO=["Soledad","Ansiedad","Frustración","Aburrimiento","Inseguridad","Rechazo","Culpa","Enojo"];
const TR=[
["No puedo vivir sin esa persona.","Mi vida está en Cristo.","Col. 3:3-4"],
["Necesito esto para estar tranquilo.","Puedo presentar mis ansiedades a Dios.","Fil. 4:6-7"],
["No tengo dominio propio.","El Espíritu produce dominio propio.","Gál. 5:22-23"],
["Mi pasado determina mi futuro.","En Cristo hay nueva creación.","2 Co. 5:17"],
["No puedo cambiar.","Dios obra en sus hijos el querer y el hacer.","Fil. 2:12-13"],
["Necesito satisfacer inmediatamente mis deseos.","Puedo aprender contentamiento en Cristo.","Fil. 4:11-13"],
["Sin mí, todo se cae.","Dios perfeccionará la obra que comenzó.","Fil. 1:6"],
["Mi valor depende de lo que otros piensen de mí.","Mi identidad está en Cristo, no en la aprobación ajena.","Gál. 2:20"],
["Si no me necesitan, no valgo.","Fui comprado por precio; mi valor ya fue decretado en la cruz.","1 Co. 6:20"],
["Tengo que complacer a todos.","Busco agradar a Dios antes que quedar bien con la gente.","Gál. 1:10"]];
const RF=[
["1. Identidad en Cristo vs. temor del hombre",[["¿Estoy buscando en una persona la seguridad, aceptación o valor que solo Dios puede darme?","Jer. 17:5-8"],["¿Qué tanto mi identidad se sostiene en Cristo y no en la aprobación de los demás?","Gál. 2:20"],["¿Me preocupa demasiado si le caigo bien a la gente más que agradar a Dios?","Jn. 12:43"],["¿Me siento avergonzado de quién soy en lugar de descansar en mi nueva identidad en Cristo?","2 Co. 5:17"]]],
["2. Límites y control",[["¿Estoy tratando de controlar, rescatar o resolver la vida de otros en lugar de dejarlos en manos de Dios?","1 Pe. 5:7"],["¿Me siento responsable de otros hasta el punto de descuidar mi propia vida y relación con Dios?","Mt. 11:28-30"],["¿Trato de manipular con amenazas, súplicas o sobornos para no perder vínculos?","Ef. 4:15"],["¿Permito que otros me lastimen una y otra vez sin poner límites saludables?","Ef. 4:25"]]],
["3. Amor verdadero vs. necesidad de ser necesitado",[["¿Mi servicio nace del amor genuino o de la necesidad de sentirme indispensable?","1 Co. 13:3"],["¿Me canso de dar porque, en el fondo, espero recibir algo a cambio?","Col. 3:23-24"],["¿Confundo amor con dependencia emocional?","Ef. 5:2"],["¿Estoy viviendo como «mártir» esperando reconocimiento humano en lugar de confiar en el galardón de Dios?","Mt. 6:33"]]],
["4. Culpa, enojo y heridas no sanadas",[["¿Estoy más enfocado en culpar a otros que en rendir cuentas por mi propio corazón?","Mt. 7:3-5"],["¿Me siento constantemente no apreciado, y eso alimenta mi resentimiento?","Gál. 1:10"],["¿Mi enojo refleja la justicia de Dios o simplemente frustración porque no obtuve lo que quería?","Stg. 1:19-20"],["¿Me comporto como víctima o mártir para llamar la atención o manipular la situación?","Lc. 9:23"]]],
["5. Fe y confianza en Dios",[["¿Confío en que Dios puede obrar en la vida de otros, o creo que sin mí todo se desmorona?","Fil. 1:6"],["¿Mi oración refleja confianza en Dios o un intento de controlar las circunstancias?","Fil. 4:6-7"],["¿Estoy dispuesto a soltar lo que me ata y descansar en que Dios es suficiente?","Sal. 55:22"],["Si mañana esa persona ya no estuviera, ¿seguiría creyendo que Cristo es suficiente para mí?","Hab. 3:17-18"]]],
["6. Libertad en Cristo",[["¿Estoy viviendo en la libertad con la que Cristo me hizo libre o en la esclavitud emocional hacia otros?","Gál. 5:1"],["¿Estoy sacrificando mi paz, mi relación con Dios o mi familia por mantener una relación dañina?","Mt. 6:33"],["¿Vivo en extremos —siendo «demasiado responsable» o totalmente irresponsable— en lugar de caminar en el equilibrio de la gracia?","Ecl. 7:18"],["¿Qué necesito entregar hoy a Dios para dejar de vivir atado a la codependencia?","Jn. 8:36"]]]];
const PF=[["alertas","Mis señales de alerta","¿Qué siento o pienso justo antes?"],["disp","Mis disparadores","Personas, lugares, horas, emociones"],["quien","Mi persona de confianza","Nombre"],["tel","Su teléfono o contacto",""],["pasaje","Mi pasaje y mi verdad","Ej.: Fil. 4:6-7. Puedo presentar mis ansiedades a Dios."],["accion","Mi acción alternativa","Orar, salir del lugar, llamar a…"],["emer","Número de emergencia de mi país",""]];
const CQ=["¿He perdido la capacidad de controlar esta conducta?","¿He intentado detenerla sin conseguirlo?","¿Continúo a pesar de reconocer sus consecuencias negativas?","¿Está desplazando responsabilidades, relaciones y actividades importantes?","¿Se ha convertido en mi principal recurso para sentir placer o aliviar malestar?"];
const TABS=[["hoy","Hoy"],["ver","Verdades"],["ref","Reflexiona"],["plan","Mi plan"],["chq","Chequeo"]];

const chips=(a,list,cur)=>list.map(x=>`<button class="chip ${cur===x?"on":""}" data-a="${a}" data-v="${esc(x)}">${esc(x)}</button>`).join("");
const tcard=(x,del)=>`<div class="card t">${del!=null?`<button class="x" data-a="delM" data-v="${del}" aria-label="Eliminar">×</button>`:""}<div class="lie">${esc(x[0])}</div><div class="truth">${esc(x[1])}</div>${x[2]?`<span class="ref">${esc(x[2])}</span>`:""}</div>`;

function vHoy(){
const n=S.e.length,wk=S.e.filter(e=>Date.now()-e.t<6048e5),cnt={};
wk.forEach(e=>{if(e.emo)cnt[e.emo]=(cnt[e.emo]||0)+1});
const mx=Math.max(1,...Object.values(cnt));
const bars=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span style="width:100px">${esc(k)}</span><i style="width:${v/mx*140}px"></i>${v}</div>`).join("");
return `<div class="card"><h2>Diario de impulsos</h2><p class="m">Cuando aparezca el deseo, tómate 30 segundos. El craving no es una orden: sentir el impulso no significa que debas obedecerlo.</p>
<label>¿Qué sentí?</label><div class="chips">${chips("emo",EMO,D.emo)}</div>
<label>¿Qué lo activó?</label><input data-f="trig" value="${esc(D.trig)}" placeholder="Una discusión, estar solo, una noticia…">
<label>¿Qué hice?</label><input data-f="did" value="${esc(D.did)}" placeholder="Lo que hice o voy a hacer">
<label>¿Qué verdad respondo?</label><select data-f="truth"><option value="">Elegir una verdad…</option>${TR.map((x,i)=>`<option value="${i}" ${D.truth==i&&D.truth!==""?"selected":""}>${esc(x[0])}</option>`).join("")}</select>
<button class="btn" data-a="addE">Guardar registro</button></div>
${n?`<div class="card t"><h2>Mis patrones (últimos 7 días)</h2>${bars||'<p class="m">Aún no hay emociones registradas esta semana.</p>'}<p class="m" style="margin-top:10px">Total de registros: ${n}. Revisar qué emociones y situaciones se repiten te ayuda a entender la función de la conducta.</p></div>
<h2 style="margin:20px 0 10px">Registros recientes</h2>`+S.e.slice(0,10).map((e,i)=>`<div class="card"><button class="x" data-a="delE" data-v="${i}" aria-label="Eliminar">×</button><b style="font-family:var(--sans)">${new Date(e.t).toLocaleString("es",{dateStyle:"medium",timeStyle:"short"})}</b><div class="m" style="margin:6px 0 0">${e.emo?`<b>Sentí:</b> ${esc(e.emo)}<br>`:""}${e.trig?`<b>Lo activó:</b> ${esc(e.trig)}<br>`:""}${e.did?`<b>Hice:</b> ${esc(e.did)}<br>`:""}${e.tr!=null&&TR[e.tr]?`<b>Mi verdad:</b> ${esc(TR[e.tr][1])} (${esc(TR[e.tr][2])})`:""}</div></div>`).join(""):""}`;
}
function vVer(){
const d=new Date(),dayCard=TR[(d.getFullYear()*366+d.getMonth()*31+d.getDate())%TR.length];
return `<div class="big"><div class="m" style="color:#f0b9a5;font-weight:700">VERDAD DE HOY</div><div class="lie" style="color:#f0b9a5">${esc(dayCard[0])}</div><div class="truth">${esc(dayCard[1])}</div><span class="ref" style="background:#D9744F">${esc(dayCard[2])}</span></div>
<div class="card"><h2>Agrega tu propia mentira</h2><p class="m">Identifica la frase que te repites, confróntala con la Escritura y escribe la verdad.</p>
<label>La mentira que creo</label><input data-f="nm" value="${esc(D.nm)}" placeholder="No puedo cambiar.">
<label>La verdad de Dios</label><input data-f="nv" value="${esc(D.nv)}">
<label>Pasaje</label><input data-f="nr" value="${esc(D.nr)}" placeholder="Fil. 2:12-13">
<button class="btn s" data-a="addM">Agregar tarjeta</button></div>
${S.m.length?`<h2 style="margin:20px 0 10px">Mis tarjetas</h2>`+S.m.map((x,i)=>tcard(x,i)).join(""):""}
<h2 style="margin:20px 0 10px">Mentira → Verdad</h2>${TR.map(x=>tcard(x)).join("")}`;
}
function vRef(){
return `<h2>Reflexiona</h2><p class="m">Preguntas para desenmascarar la codependencia. No son cómodas, pero sí liberadoras. Tus respuestas se guardan solo en este dispositivo.</p>`+RF.map((g,i)=>`<details><summary>${esc(g[0])}</summary><div>${g[1].map((q,j)=>`<div class="q"><p>${esc(q[0])} <span class="ref">${esc(q[1])}</span></p><textarea data-f="r.${i}-${j}" placeholder="Mi respuesta…">${esc(S.r[i+"-"+j]||"")}</textarea></div>`).join("")}</div></details>`).join("");
}
function vPlan(){
return `<div class="card t"><h2>Mi plan de respuesta</h2><p class="m">Arma tu plan hoy, con calma, antes del momento difícil. Cuando llegue el impulso, solo tendrás que abrirlo.</p>
${PF.map(f=>`<label>${f[1]}</label>${f[0]==="alertas"||f[0]==="disp"||f[0]==="pasaje"||f[0]==="accion"?`<textarea data-f="p.${f[0]}" placeholder="${esc(f[2])}">${esc(S.p[f[0]]||"")}</textarea>`:`<input data-f="p.${f[0]}" value="${esc(S.p[f[0]]||"")}" placeholder="${esc(f[2])}">`}`).join("")}
<button class="btn" data-a="crisis">Abrir mi plan ahora</button></div>
<div class="note">Esta herramienta acompaña tu proceso, pero no sustituye a un consejero, pastor o profesional. Si estás en peligro o piensas hacerte daño, llama de inmediato al número de emergencia de tu país o busca a una persona de confianza.</div>
<button class="btn g" data-a="wipe">Borrar todos mis datos de este dispositivo</button>`;
}
function vChq(){
const c=S.c.filter(Boolean).length;
const msg=c==0?"Marca las preguntas a las que respondas que sí.":c<3?"Hay algunas señales. Es buen momento para observar, escribir en el diario y hablar con alguien de confianza.":"Hay varias señales presentes. Te animamos a hablar pronto con un consejero, pastor o profesional de salud. No tienes que llevarlo solo.";
return `<h2>Chequeo personal</h2><p class="m">Cinco preguntas para identificar una dependencia problemática. Es una guía de reflexión, no un diagnóstico.</p>
${CQ.map((q,i)=>`<button class="ck ${S.c[i]?"on":""}" data-a="chk" data-v="${i}"><b></b><span>${esc(q)}</span></button>`).join("")}
<div class="note"><b>${c} de 5.</b> ${msg}</div>
<div class="big"><div class="truth">¿Estás utilizando aquello que tienes o aquello que tienes está comenzando a utilizarte a ti?</div></div>`;
}
function vCrisis(){
const f=PF.filter(x=>S.p[x[0]]).map(x=>`<div class="f"><small>${esc(x[1]).toUpperCase()}</small>${esc(S.p[x[0]])}</div>`).join("");
return `<div id="cr"><h2>Haz una pausa</h2><p style="font:20px/1.5 var(--sans)">El impulso no es una orden. Respira. Cambia de lugar. Busca a alguien. Recuerda la verdad.</p>${f||'<p style="font:16px var(--sans)">Aún no has armado tu plan. Hazlo en la pestaña «Mi plan».</p>'}<p style="font:15px/1.5 var(--sans);margin-top:18px">Si estás en peligro o piensas hacerte daño, llama ya al número de emergencia de tu país.</p><button class="btn" data-a="close">Volver</button></div>`;
}
function render(){
const v={hoy:vHoy,ver:vVer,ref:vRef,plan:vPlan,chq:vChq}[tab]();
document.getElementById("app").innerHTML=v+(crisis?vCrisis():"");
document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("");
}
document.addEventListener("click",ev=>{
const b=ev.target.closest("[data-a]");if(!b)return;
const a=b.dataset.a,v=b.dataset.v;
if(a==="tab"){tab=v;window.scrollTo(0,0)}
else if(a==="emo")D.emo=D.emo===v?"":v;
else if(a==="addE"){if(!D.emo&&!D.trig&&!D.did&&D.truth===""){alert("Escribe o elige al menos un dato.");return}
S.e.unshift({t:Date.now(),emo:D.emo,trig:D.trig,did:D.did,tr:D.truth===""?null:+D.truth});save();D.emo=D.trig=D.did=D.truth=""}
else if(a==="delE"){S.e.splice(+v,1);save()}
else if(a==="addM"){if(!D.nm.trim()||!D.nv.trim()){alert("Escribe la mentira y la verdad.");return}
S.m.unshift([D.nm.trim(),D.nv.trim(),D.nr.trim()]);save();D.nm=D.nv=D.nr=""}
else if(a==="delM"){S.m.splice(+v,1);save()}
else if(a==="chk"){S.c[+v]=!S.c[+v];save()}
else if(a==="crisis")crisis=true;
else if(a==="close")crisis=false;
else if(a==="wipe"){if(confirm("¿Borrar todos tus registros, tarjetas, respuestas y plan de este dispositivo?")){S={e:[],m:[],r:{},p:{},c:[]};save()}}
render();
});
document.addEventListener("input",ev=>{
const f=ev.target.dataset.f;if(!f)return;
const val=ev.target.value;
if(f.indexOf("p.")===0){S.p[f.slice(2)]=val;save()}
else if(f.indexOf("r.")===0){S.r[f.slice(2)]=val;save()}
else D[f]=val;
});
render();
</script>
</body>
</html>
